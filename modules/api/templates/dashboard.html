<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shel — Pentest Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--surface:#121820;--surface2:#1a2530;--border:#1e2d3d;--text:#c5d1e0;--text-dim:#6a7f99;--accent:#00ff88;--accent2:#00ccff;--red:#ff3355;--yellow:#ffcc00;--orange:#ff8800;--font:'JetBrains Mono','Fira Code','Cascadia Code',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:1px}
header .sub{color:var(--text-dim);font-size:11px}
header .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.online{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.status-dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
header .status-text{font-size:11px;color:var(--text-dim)}
header .spacer{flex:1}
header .model-badge{background:var(--surface2);color:var(--accent2);padding:3px 10px;border-radius:4px;font-size:11px;border:1px solid var(--border)}
.main{display:flex;flex:1;overflow:hidden}
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px 20px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-track{background:transparent}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{margin-bottom:14px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg .label{font-size:10px;color:var(--text-dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px}
.msg.user .label{color:var(--accent2)}
.msg.assistant .label{color:var(--accent)}
.msg.system .label{color:var(--orange)}
.msg .bubble{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6}
.msg.user .bubble{border-color:var(--accent2);background:rgba(0,204,255,0.05)}
.msg.assistant .bubble{border-color:var(--accent);background:rgba(0,255,136,0.04)}
.msg.system .bubble{border-color:var(--orange);background:rgba(255,136,0,0.06)}
.msg .bubble .tool-call{color:var(--yellow);font-size:11px;margin-top:4px;padding:4px 8px;background:var(--bg);border-radius:3px;display:inline-block}
.msg .bubble .tool-result{color:var(--text-dim);font-size:11px;margin-top:4px;padding:4px 8px;background:var(--surface2);border-radius:3px}
.input-area{background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;flex-shrink:0}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--accent)}
.input-row input::placeholder{color:var(--text-dim)}
.input-row button{background:var(--accent);color:var(--bg);border:none;border-radius:4px;padding:10px 20px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.input-row button:hover{opacity:.85}
.input-row button:disabled{opacity:.4;cursor:not-allowed}
.sidebar{width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-section{border-bottom:1px solid var(--border);padding:12px 14px}
.sidebar-section h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.stat-row .stat-label{color:var(--text-dim)}
.stat-row .stat-value{color:var(--text)}
.findings-list{max-height:160px;overflow-y:auto}
.findings-list::-webkit-scrollbar{width:3px}
.findings-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.finding-item{padding:4px 0;font-size:11px;color:var(--text-dim);border-bottom:1px solid rgba(255,255,255,.03)}
.finding-item .sev{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.sev.critical{background:var(--red)}
.sev.high{background:var(--orange)}
.sev.medium{background:var(--yellow)}
.sev.low{background:var(--accent2)}
.quick-cmds{margin-top:4px}
.quick-cmd{display:inline-block;padding:3px 8px;margin:2px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;font-size:11px;color:var(--accent2);cursor:pointer;transition:all .2s}
.quick-cmd:hover{background:var(--border);color:var(--accent)}
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;color:var(--text-dim);font-size:12px}
.typing .dots{display:flex;gap:3px}
.typing .dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.conn-error{color:var(--red);padding:20px;text-align:center;font-size:14px}
.collapse-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:10px;font-family:var(--font);padding:2px 6px;border-radius:3px}
.collapse-btn:hover{background:var(--surface2)}
@media(max-width:768px){.sidebar{display:none}.main{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>⎔ SHEL</h1>
  <span class="sub">pentest dashboard</span>
  <span class="spacer"></span>
  <span><span class="status-dot offline" id="statusDot"></span><span class="status-text" id="statusText">connecting</span></span>
  <span class="model-badge" id="modelBadge">-</span>
</header>
<div class="main">
  <div class="chat-area">
    <div class="msgs" id="msgs"></div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="input" placeholder="Type a command or message..." autofocus>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Session</h3>
      <div class="stat-row"><span class="stat-label">Target</span><span class="stat-value" id="sTarget">-</span></div>
      <div class="stat-row"><span class="stat-label">Mode</span><span class="stat-value" id="sMode">-</span></div>
      <div class="stat-row"><span class="stat-label">Phase</span><span class="stat-value" id="sPhase">-</span></div>
      <div class="stat-row"><span class="stat-label">Findings</span><span class="stat-value" id="sFindings">0</span></div>
      <div class="stat-row"><span class="stat-label">Actions</span><span class="stat-value" id="sActions">0</span></div>
      <div class="stat-row"><span class="stat-label">Docker</span><span class="stat-value" id="sDocker">-</span></div>
    </div>
    <div class="sidebar-section">
      <h3>Recent Findings</h3>
      <div class="findings-list" id="findingsList"><div style="color:var(--text-dim);font-size:11px">none</div></div>
    </div>
    <div class="sidebar-section">
      <h3>Quick Commands</h3>
      <div class="quick-cmds">
        <span class="quick-cmd" data-cmd="/status">/status</span>
        <span class="quick-cmd" data-cmd="/compile list">/compile</span>
        <span class="quick-cmd" data-cmd="/stego techniques">/stego</span>
        <span class="quick-cmd" data-cmd="/c2 info">/c2 info</span>
        <span class="quick-cmd" data-cmd="/supplychain recon">/supplychain</span>
        <span class="quick-cmd" data-cmd="/evasion bypass all">/evasion</span>
      </div>
    </div>
  </div>
</div>

<script>
const $=(s)=>document.querySelector(s);const $$=(s)=>document.querySelectorAll(s);
const msgsEl=$('#msgs');const input=$('#input');const sendBtn=$('#sendBtn');
let msgHistory=[];

function addMsg(role,content,extra){
  const div=document.createElement('div');
  div.className='msg '+role;
  const label={'user':'You','assistant':'Shel','system':'System'};
  let html=`<div class="label">${label[role]||role}</div><div class="bubble">${escapeHtml(content)}`;
  if(extra){
    if(extra.toolCalls) html+=extra.toolCalls.map(t=>`<div class="tool-call">⚡ ${escapeHtml(t.name)}(${escapeHtml(JSON.stringify(t.input))})</div>`).join('');
    if(extra.toolResult) html+=`<div class="tool-result">${escapeHtml(extra.toolResult)}</div>`;
  }
  html+='</div>';
  div.innerHTML=html;
  msgsEl.appendChild(div);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function showTyping(){
  const div=document.createElement('div');
  div.className='msg assistant';
  div.id='typingIndicator';
  div.innerHTML='<div class="label">Shel</div><div class="typing"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div> thinking...</div>';
  msgsEl.appendChild(div);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function hideTyping(){
  const el=document.getElementById('typingIndicator');
  if(el) el.remove();
}

async function sendMessage(text){
  if(!text.trim()) return;
  input.value='';
  addMsg('user',text);
  showTyping();
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });
    hideTyping();
    if(!resp.ok){
      const err=await resp.json();
      addMsg('system','Error: '+(err.error||resp.statusText));
      return;
    }
    const data=await resp.json();
    if(data.blocks){
      for(const b of data.blocks){
        if(b.type==='text') addMsg('assistant',b.content);
        else if(b.type==='tool_use') addMsg('system','⚡ Tool: '+b.name+'('+JSON.stringify(b.input)+')');
      }
    }
    if(data.error) addMsg('system','Error: '+data.error);
  }catch(e){
    hideTyping();
    addMsg('system','Connection error: '+e.message);
  }
}

async function fetchStatus(){
  try{
    const resp=await fetch('/api/status');
    if(!resp.ok) throw new Error('Failed');
    const s=await resp.json();
    const dot=$('#statusDot');dot.className='status-dot online';
    $('#statusText').textContent='online';
    $('#modelBadge').textContent=s.provider+':'+(s.model||'?');
    $('#sTarget').textContent=s.target||'-';
    $('#sMode').textContent=s.mode||'-';
    $('#sPhase').textContent=s.phase_name||'-';
    $('#sFindings').textContent=s.findings_count||0;
    $('#sActions').textContent=s.actions_count||0;
    $('#sDocker').textContent=s.docker_available?'yes':'no';
    const fl=$('#findingsList');
    if(s.recent_findings&&s.recent_findings.length){
      fl.innerHTML=s.recent_findings.map(f=>{
        const sev=(f.severity||'low').toLowerCase();
        return `<div class="finding-item"><span class="sev ${sev}"></span>${escapeHtml(f.description||JSON.stringify(f))}</div>`;
      }).join('');
    }else fl.innerHTML='<div style="color:var(--text-dim);font-size:11px">none</div>';
  }catch(e){
    const dot=$('#statusDot');dot.className='status-dot offline';
    $('#statusText').textContent='offline';
  }
}

input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(input.value)}});
sendBtn.addEventListener('click',()=>sendMessage(input.value));

$$('.quick-cmd').forEach(el=>{
  el.addEventListener('click',()=>{
    const cmd=el.dataset.cmd;
    if(cmd.startsWith('/')) sendMessage(cmd);
  });
});

setInterval(fetchStatus,3000);
fetchStatus();

addMsg('system','Welcome to Shel. Type a message or use /commands. The sidebar shows session status.');
</script>
</body>
</html>
